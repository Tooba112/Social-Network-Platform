<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search | SocialNet</title><link rel="stylesheet" href="css/style.css"></head><body><header id="navbar" class="navbar"></header><main class="page-shell"><section class="main-column"><div class="card"><h1>Find people</h1><label for="user-search">Search by name or email</label><input id="user-search" type="search" autocomplete="off"><div id="search-results"></div></div></section></main><nav id="bottom-nav" class="bottom-nav"></nav><div id="toast-container"></div><script src="js/auth.js"></script><script>if (requireAuth()) { renderNavbar(); renderBottomNav(); const input = document.getElementById('user-search'); const results = document.getElementById('search-results'); let timer; input.addEventListener('input', () => { clearTimeout(timer); const q = input.value.trim(); if (!q) { results.innerHTML = ''; return; } timer = setTimeout(async () => { try { const users = await apiFetch('/api/users/search?q=' + encodeURIComponent(q)); results.innerHTML = users.length ? users.map(user => '<div class="search-result-item"><img class="search-result-avatar" src="' + avatarSrc(user.profilePicture, user.name) + '" alt="' + escapeHtml(user.name) + ' avatar"><a href="profile.html?id=' + user._id + '">' + escapeHtml(user.name) + '</a></div>').join('') : '<p>No users found.</p>'; } catch (e) { results.textContent = e.message; } }, 300); }); }</script></body></html>
