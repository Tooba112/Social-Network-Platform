<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | SocialNet</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <main class="auth-page"><section class="card auth-card"><h1>Create your account</h1><form id="register-form"><div class="form-group"><label for="name">Name</label><input id="name" name="name" required maxlength="50" autocomplete="name"></div><div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div><div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn btn-primary" type="submit">Register</button></form><p id="auth-error" class="error-msg" role="alert"></p><p>Already registered? <a href="login.html">Log in</a></p></section></main>
  <script src="js/auth.js"></script><script>redirectIfLoggedIn(); document.getElementById('register-form').addEventListener('submit', async (event) => { event.preventDefault(); const error = document.getElementById('auth-error'); const name = document.getElementById('name'); const email = document.getElementById('email'); const password = document.getElementById('password'); error.textContent = ''; try { const data = await apiFetch('/api/auth/register', { method: 'POST', body: JSON.stringify({ name: name.value.trim(), email: email.value.trim(), password: password.value }) }); saveAuth(data); window.location.href = 'feed.html'; } catch (e) { error.textContent = e.message; } });</script>
</body></html>
