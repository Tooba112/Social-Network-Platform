<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings | SocialNet</title><link rel="stylesheet" href="css/style.css"><script src="http://localhost:5000/socket.io/socket.io.js"></script></head><body><header id="navbar" class="navbar"></header><main class="page-shell"><aside class="sidebar"><a id="sidebar-profile-link" href="profile.html">My profile</a><a href="feed.html">Feed</a></aside><section class="main-column"><h1>Settings</h1><section class="card"><h2>Profile information</h2><div class="form-group"><label for="settings-name">Name</label><input id="settings-name" maxlength="50"></div><div class="form-group"><label for="settings-email">Email</label><input id="settings-email" type="email" readonly></div><div class="form-group"><label for="settings-bio">Bio</label><textarea id="settings-bio" maxlength="200"></textarea></div><button class="btn btn-primary" onclick="saveProfileInfo()">Save profile</button></section><section class="card"><h2>Profile picture</h2><img id="settings-preview" class="profile-pic" alt="Profile preview"><input type="file" accept="image/*" onchange="uploadPicFromSettings(this)"></section><section class="card"><h2>Privacy</h2><div class="form-group"><label for="profile-privacy">Profile visibility</label><select id="profile-privacy"><option value="public">Public</option><option value="friends">Friends</option><option value="private">Private</option></select></div><div class="form-group"><label for="posts-privacy">Post visibility</label><select id="posts-privacy"><option value="public">Public</option><option value="friends">Friends</option><option value="private">Private</option></select></div><button class="btn btn-primary" onclick="savePrivacySettings()">Save privacy</button></section><button class="btn btn-danger" onclick="handleLogout()">Log out</button></section></main><nav id="bottom-nav" class="bottom-nav"></nav><div id="toast-container"></div><script src="js/auth.js"></script><script src="js/socket.js"></script><script src="js/settings.js"></script></body></html>
